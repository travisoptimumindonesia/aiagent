name: Mandarin platform checks
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check && npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r services/bridge/requirements.lock
      - run: python -m unittest discover -s test -p 'test_*.py' -v
      - run: bash -n scripts/setup.sh scripts/deploy.sh scripts/backup.sh scripts/restore.sh
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose and build core images
        run: |
          cp .env.example .env
          printf '\nSERVICE_TOKEN=ci-configuration-only-not-a-real-secret-123456789\nADMIN_PASSWORD=ci-test-only-password\n' >> .env
          docker compose config --quiet
          docker compose build app bridge
      - name: Boot core services
        run: |
          docker compose up -d --wait --wait-timeout 120 app bridge
          curl --fail http://127.0.0.1:3000/health
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=100 app bridge
      - name: Stop containers
        if: always()
        run: docker compose down
